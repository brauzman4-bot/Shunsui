<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FUNTIK DESIGN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#09050f;--tx:#f5eeff;--mu:#cdbfe6;--ac:#b06cff;--ac2:#7a3df0;--bd:rgba(255,255,255,.1);color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(120% 60% at 50% 0,rgba(176,108,255,.22),transparent 60%),var(--bg);color:#fff;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.38}
.bg i:nth-child(1){width:300px;height:300px;background:#7a3df0;top:-80px;left:-90px;animation:fl 14s ease-in-out infinite}
.bg i:nth-child(2){width:260px;height:260px;background:#d048ff;top:42%;right:-110px;animation:fl 18s ease-in-out infinite reverse}
.bg i:nth-child(3){width:280px;height:280px;background:#4b2bd6;bottom:-90px;left:10%;animation:fl 16s ease-in-out infinite}
@keyframes fl{50%{transform:translate(40px,-50px) scale(1.15)}}
@media(prefers-reduced-motion:reduce){.bg i{animation:none}.view.on{animation:none!important}}
/* жидкое стекло */
.gl{position:relative;background:rgba(255,255,255,.05);border:1px solid var(--bd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top.gl,.nav.gl{background:rgba(20,12,32,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.nav.gl{box-shadow:0 10px 30px rgba(0,0,0,.35)}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(112px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-radius:999px;font-weight:700;letter-spacing:.12em;font-size:13px}
.top span{color:var(--mu);font-weight:500;letter-spacing:0;font-size:13px}
.view{display:none;padding-top:22px}.view.on{display:block;animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
h1{font-size:clamp(58px,19vw,84px);line-height:.92;letter-spacing:-.035em;font-weight:900;background:linear-gradient(180deg,#fff 30%,#dcb8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:26px;font-weight:800;margin:30px 0 12px;letter-spacing:-.01em}
.sub{color:#e6dbf5;font-size:19px;font-weight:500;margin:12px 0 20px}
.gif{border-radius:28px;padding:6px;overflow:hidden}
.gif img{display:block;width:100%;aspect-ratio:498/281;object-fit:cover;border-radius:22px;background:#1a0f2b}
.btn{display:inline-block;padding:14px 26px;border-radius:99px;font-weight:700}
.btn.p{background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 8px 22px rgba(122,61,240,.4)}
.btn:active,.card:active{transform:scale(.98)}
.hero-b{display:flex;gap:10px;margin-top:16px}
.svc{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-radius:22px;margin-bottom:10px;width:100%;text-align:left;transition:transform .15s}
.svc b{display:block;font-size:17px}.svc span{color:var(--mu);font-size:13px}
.price{font-weight:800;font-size:19px;color:#f0deff;white-space:nowrap}
.quote{margin-top:30px;padding:26px 22px;border-radius:26px;text-align:center;font-size:21px;line-height:1.3;font-weight:600}
.quote small{display:block;margin-top:8px;font-size:12px;color:var(--mu);font-weight:400}
.sq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;min-width:0}
.card{width:100%;min-width:0;min-height:0;aspect-ratio:1 / 1;box-sizing:border-box;border-radius:26px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .15s}
.card b{font-size:15px;font-weight:800;letter-spacing:.06em}
.card em{font-style:normal;font-size:38px;font-weight:900;color:#f0deff}
.card.soon{opacity:.75}.card.soon em{font-size:18px;color:var(--mu);letter-spacing:.14em}
.ord{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:22px;margin-bottom:10px}
.ord b{display:block}.ord span{font-size:13px;color:var(--mu)}
.st{display:flex;align-items:center;gap:10px}
.st button{width:36px;height:36px;border-radius:50%;font-size:20px;background:rgba(255,255,255,.1);border:1px solid var(--bd)}
.st output{min-width:26px;text-align:center;font-size:20px;font-weight:800}
textarea{width:100%;min-height:84px;resize:none;margin-top:4px;padding:14px 16px;border-radius:22px;background:rgba(255,255,255,.07);border:1px solid var(--bd);color:var(--tx);font:inherit;outline:0}
textarea:focus-visible{border-color:var(--ac)}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:18px;border-radius:22px;margin-top:12px;color:var(--mu)}
.tot b{font-size:30px;color:var(--tx)}
.note{font-size:12.5px;color:var(--mu);margin:10px 4px 14px}
.info{padding:20px;border-radius:26px;margin-bottom:12px}
.info p{margin-bottom:6px}.info .mu{color:var(--mu)}
.rules{list-style:none;counter-reset:r;display:grid;gap:12px;margin-top:12px}
.rules li{counter-increment:r;padding-left:34px;position:relative}
.rules li:before{content:counter(r);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:rgba(176,108,255,.3);border:1px solid var(--bd)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:2px;padding:6px;border-radius:99px;width:min(94vw,420px)}
.nav button{flex:1;padding:9px 0 7px;border-radius:99px;font-size:11px;color:var(--mu);display:grid;justify-items:center;gap:3px;transition:.2s}
.nav button.on{color:var(--tx);background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px var(--bd),0 0 18px rgba(176,108,255,.3)}
.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:10px 18px;border-radius:99px;font-size:14px;transition:.25s;z-index:40}.toast.on{opacity:1;transform:translate(-50%,0)}
.bg{display:none}
</style>
</head>
